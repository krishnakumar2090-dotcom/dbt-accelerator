version: 2

models:
  - name: clinical_trials
    description: "Clinical trials data model combining trial, site, and enrollment information."
    columns:
      - name: trial_id
        description: "Primary key for trial."
        tests:
          - not_null
          - unique
      - name: protocol_number
        description: "Protocol number for the trial, standardized to uppercase and trimmed."
        tests:
          - not_null
      - name: study_title
        description: "Title of the study, latest version only, UTF-8 encoded."
        tests:
          - not_null
      - name: site_id
        description: "Site identifier, composite primary key with trial_id."
        tests:
          - not_null
          - unique
      - name: subject_count
        description: "Number of subjects enrolled, aggregated at trial and site level."
        tests:
          - not_null
      - name: enrollment_target
        description: "Planned enrollment target for the trial."
        tests:
          - not_null
    tags:
      - clinical_trials
      - dbt_model
    meta:
      owner: "Clinical Data Team"
      source: "vcv_trials, vcv_sites, irt_enrollment"